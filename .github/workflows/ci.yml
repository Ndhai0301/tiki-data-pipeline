name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (spark/transform.py)
        run: pytest tests/ -v

  dbt-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiki
          POSTGRES_PASSWORD: tiki
          POSTGRES_DB: tiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiki -d tiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBT_PG_HOST: localhost
      DBT_PG_PORT: "5432"
      PGPASSWORD: tiki
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-core dbt-postgres

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Seed empty raw.listings (schema-only, no crawled data needed)
        run: psql -h localhost -U tiki -d tiki -f .github/ci/seed_raw_listings.sql

      - name: dbt run (staging) + dbt snapshot
        working-directory: dbt
        run: dbt run --select staging --profiles-dir . && dbt snapshot --profiles-dir .

      - name: dbt run (marts)
        working-directory: dbt
        run: dbt run --profiles-dir .

      - name: dbt test
        working-directory: dbt
        run: dbt test --profiles-dir .
