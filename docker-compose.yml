name: tiki-crawl

services:
  postgres:
    image: postgres:16
    container_name: tiki_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiki
      POSTGRES_PASSWORD: tiki
      POSTGRES_DB: tiki
    ports:
      - "5433:5432"
    volumes:
      - tiki_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiki -d tiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.50.34
    container_name: tiki_metabase
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - tiki_metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      postgres:
        condition: service_healthy

  airflow-postgres:
    image: postgres:16
    container_name: tiki_airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - tiki_airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build: ./airflow
    container_name: tiki_airflow_init
    # Chay cung UID voi host user (1000, "hai") thay vi UID mac dinh cua
    # image (50000, "airflow"). ./dags va . deu la bind-mount tu host -
    # khac UID gay loi Permission denied lien tuc moi khi 1 ben ghi file
    # (container ghi Bronze/Silver/dbt/target, hoac host chay dbt/test
    # tay) roi ben kia doc/ghi lai (da gap 3 lan that, xem lich su commit).
    # Cung UID: khong con phan biet "chu file" (owner check chi can UID
    # trung), ca 2 phia deu doc/ghi tu do, khong can chmod lai nua.
    #
    # GID PHAI la 0 (khong phai 1000 cua host) - image Airflow chinh thuc
    # bat buoc GID=0 de ho tro chay voi UID tuy y (bao loi ngay neu dat
    # GID khac 0, da gap khi thu 1000:1000). Khong anh huong muc tieu tren
    # vi UID trung la du de duoc quyen "owner".
    user: "1000:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Bangkok
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Bangkok
      PG_DSN: "host=postgres port=5432 dbname=tiki user=tiki password=tiki"
      DBT_PG_HOST: postgres
      DBT_PG_PORT: "5432"
    volumes: &airflow-common-volumes
      - ./dags:/opt/airflow/dags
      - .:/opt/tiki-crawl
      - tiki_airflow_logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate && (airflow users create --username admin --password admin --firstname A --lastname D --role Admin --email admin@example.com || true)"

  airflow-webserver:
    build: ./airflow
    container_name: tiki_airflow_webserver
    restart: unless-stopped
    user: "1000:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8081:8080"
    command: airflow webserver

  airflow-scheduler:
    build: ./airflow
    container_name: tiki_airflow_scheduler
    restart: unless-stopped
    user: "1000:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: airflow scheduler

volumes:
  tiki_postgres_data:
  tiki_metabase_data:
  tiki_airflow_postgres_data:
  tiki_airflow_logs:
