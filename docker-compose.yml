name: tiki-crawl

services:
  postgres:
    image: postgres:16
    container_name: tiki_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiki
      POSTGRES_PASSWORD: tiki
      POSTGRES_DB: tiki
    ports:
      - "5433:5432"
    volumes:
      - tiki_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiki -d tiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.50.34
    container_name: tiki_metabase
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - tiki_metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tiki_postgres_data:
  tiki_metabase_data:
