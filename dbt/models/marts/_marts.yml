version: 2

models:
  - name: dim_date
    description: "Date spine dung san (2020-2035), khong phu thuoc du lieu crawl"
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: ngay
        tests: [not_null, unique]

  - name: dim_brand
    description: "Snowflake dim, tach tu stg_listings.brand_id/brand_name"
    columns:
      - name: brand_key
        tests: [not_null, unique]
      - name: brand_id
        tests: [not_null, unique]

  - name: dim_seller
    description: "Snowflake dim, tach tu stg_listings.seller_id/seller_name"
    columns:
      - name: seller_key
        tests: [not_null, unique]
      - name: seller_id
        tests: [not_null, unique]

  - name: dim_category
    description: "Snowflake dim, tach tu stg_listings.category_id/category_name"
    columns:
      - name: category_key
        tests: [not_null, unique]
      - name: category_id
        tests: [not_null, unique]

  - name: dim_product
    description: "SCD2 (nguon: snapshot dim_product_snapshot) - 1 dong = 1 phien ban san pham"
    columns:
      - name: product_key
        tests: [not_null, unique]
      - name: product_id
        tests: [not_null]

  - name: fact_price_daily
    description: "Grain (date_key, hour, product_key) - 1 dong = gia do duoc 1 lan crawl"
    columns:
      - name: date_key
        tests: [not_null]
      - name: hour
        tests: [not_null]
      - name: product_key
        tests: [not_null]
      - name: price
        tests: [not_null]

  - name: fact_price_change
    description: "Chi ghi dong khi gia thuc su doi so voi lan crawl truoc do cua cung san pham"
    columns:
      - name: product_key
        tests: [not_null]
      - name: changed_at
        tests: [not_null]
      - name: price_moi
        tests: [not_null]
