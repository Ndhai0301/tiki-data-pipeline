name: 'tiki_gold'
version: '1.0.0'
config-version: 2

profile: 'tiki'

model-paths: ["models"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  tiki_gold:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: gold
